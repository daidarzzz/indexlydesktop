[package]
name = "indexlydesktop"
version = "0.1.0"
description = "IndexLy Desktop - High performance local index manager"
authors = ["david"]
edition = "2021"

[lib]
name = "indexlydesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
deunicode = "1.6"
uuid = { version = "1", features = ["v4", "fast-rng"] }
csv = "1.3"
flate2 = "1.0"
compact_str = { version = "0.8", features = ["serde"] }
ureq = { version = "2.10", features = ["json", "gzip"] }
tauri-plugin-global-shortcut = "2.4.1"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
regex = "1.11"
sha1 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
